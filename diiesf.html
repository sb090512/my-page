<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 ㄲㅜㅁ</title>
    <!-- Google Fonts & Canvas Confetti Library -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=Noto+Sans+KR:wght@400;700;900&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-color: #080711;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-purple: #b000ff;
            --card-bg: rgba(20, 18, 38, 0.75);
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(176, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 243, 255, 0.1) 0%, transparent 40%);
            padding-bottom: 60px;
        }

        /* Ambient Cyber Grid Background & City Skyline Silhouettes */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            z-index: -2;
            pointer-events: none;
        }

        /* Neon Night City Background Overlay */
        .city-background {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45vh;
            z-index: -1;
            pointer-events: none;
            background: 
                /* City Building Silhouettes with Neon Window Lights */
                linear-gradient(to top, rgba(8, 7, 17, 0.95) 10%, transparent 100%),
                repeating-linear-gradient(90deg, 
                    rgba(15, 12, 35, 0.8) 0px, 
                    rgba(15, 12, 35, 0.8) 50px, 
                    transparent 50px, 
                    transparent 60px,
                    rgba(25, 18, 48, 0.8) 60px,
                    rgba(25, 18, 48, 0.8) 120px,
                    transparent 120px,
                    transparent 135px
                );
            box-shadow: inset 0 20px 40px rgba(0, 243, 255, 0.05);
        }

        .city-svg-buildings {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            z-index: -1;
            pointer-events: none;
            opacity: 0.65;
        }

        /* Spider-Man Wall Crawler Animation Component */
        .spidey-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
        }

        .spidey-web-line {
            position: absolute;
            stroke: var(--neon-cyan);
            stroke-width: 2.5;
            stroke-dasharray: 4 2;
            filter: drop-shadow(0 0 6px var(--neon-cyan));
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .spidey-character {
            position: absolute;
            width: 48px;
            height: 48px;
            top: 15%;
            left: 0;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 0 10px var(--neon-pink));
            transition: top 0.6s ease;
            cursor: pointer;
            pointer-events: auto;
        }

        .spidey-character:hover {
            filter: drop-shadow(0 0 15px var(--neon-cyan)) scale(1.15);
        }

        .spidey-character svg {
            width: 100%;
            height: 100%;
        }

        /* Spidey Touch Hint Bubble */
        .spidey-hint-bubble {
            position: absolute;
            left: 55px;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            background: rgba(8, 7, 17, 0.9);
            border: 1.5px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            pointer-events: none;
            animation: hintPulse 1.8s infinite alternate;
        }

        .spidey-hint-bubble::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 6px solid var(--neon-cyan);
        }

        @keyframes hintPulse {
            0% { transform: translateY(-50%) scale(0.95); opacity: 0.7; }
            100% { transform: translateY(-50%) scale(1.05); opacity: 1; box-shadow: 0 0 15px var(--neon-pink); border-color: var(--neon-pink); color: #fff; }
        }

        /* Shot Web Line Animation */
        .shot-web-line {
            position: absolute;
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 8px var(--neon-cyan));
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: shootWeb 0.35s ease-out forwards;
        }

        @keyframes shootWeb {
            to {
                stroke-dashoffset: 0;
            }
        }

        /* Web Splat Mark Impact */
        .web-splat {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 98;
            animation: splatPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, webFade 2.5s ease-in 1.5s forwards;
        }

        @keyframes splatPop {
            to {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes webFade {
            to {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
        }

        /* Tiny Neon Spider Animation */
        .neon-spider {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 100;
            filter: drop-shadow(0 0 6px var(--neon-cyan));
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease 0.8s;
        }

        .neon-spider svg {
            width: 100%;
            height: 100%;
        }

        /* Container Layout */
        .container {
            width: 90%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 0;
        }

        /* Neon Text Header */
        header {
            text-align: center;
            padding: 40px 10px 20px 10px;
        }

        .hero-badge {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        h1.title {
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--neon-pink),
                0 0 40px var(--neon-pink),
                0 0 80px var(--neon-pink);
            animation: neonPulse 2s infinite alternate;
            line-height: 1.2;
        }

        @keyframes neonPulse {
            0% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
            }
            100% {
                text-shadow: 0 0 2px #fff, 0 0 5px #fff, 0 0 15px var(--neon-pink), 0 0 25px var(--neon-pink);
            }
        }

        .subtitle {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #d0cbe5;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        /* Common Section Styles */
        section {
            margin-top: 50px;
            background: var(--card-bg);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* 3D Flip Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            perspective: 1000px;
        }

        .flip-card {
            background-color: transparent;
            height: 280px;
            cursor: pointer;
            position: relative;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 16px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border: 2px solid transparent;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        /* Front Card Styling */
        .flip-card-front {
            background: linear-gradient(135deg, rgba(30, 25, 60, 0.9), rgba(15, 12, 35, 0.95));
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }

        /* Peeking Spider Head on Card Bottom Edge */
        .peeking-spider-head {
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 56px;
            pointer-events: auto;
            transition: bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 6px var(--neon-cyan));
            z-index: 10;
        }

        .flip-card-front:hover .peeking-spider-head {
            bottom: -6px;
        }

        /* Peeking Spider Spit Hint Label */
        .spider-spit-hint {
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(255, 0, 127, 0.9);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 8px;
            box-shadow: 0 0 8px var(--neon-pink);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .flip-card-front:hover .spider-spit-hint {
            opacity: 1;
        }

        .card-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        .card-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }

        .tap-hint {
            margin-top: 15px;
            font-size: 0.8rem;
            color: var(--neon-cyan);
            border: 1px dashed var(--neon-cyan);
            padding: 4px 10px;
            border-radius: 12px;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Back Card Styling */
        .flip-card-back {
            background: linear-gradient(135deg, rgba(0, 50, 70, 0.95), rgba(10, 20, 40, 0.95));
            border-color: var(--neon-cyan);
            color: #fff;
            transform: rotateY(180deg);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            position: relative;
            overflow: hidden;
        }

        .board-spider-presenter {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        /* Spider Teacher with Pointer Stick (Much Larger) */
        .spider-teacher-svg {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 10px var(--neon-cyan));
            animation: teacherBounce 1.5s infinite alternate ease-in-out;
        }

        @keyframes teacherBounce {
            0% { transform: translateY(0) rotate(-3deg); }
            100% { transform: translateY(-4px) rotate(3deg); }
        }

        .blackboard-box {
            background: rgba(5, 25, 20, 0.85);
            border: 1.5px stroke var(--neon-cyan);
            border-style: dashed;
            border-radius: 10px;
            padding: 10px 12px;
            box-shadow: inset 0 0 10px rgba(0, 243, 255, 0.2);
            width: 100%;
        }

        .card-back-title {
            font-size: 1.1rem;
            color: var(--neon-yellow);
            font-weight: 700;
        }

        .card-reason {
            font-size: 0.88rem;
            line-height: 1.45;
            word-break: keep-all;
            color: #e2f8ff;
        }

        /* Spider Spit Liquid Drops Animation */
        .spider-spit-splat {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%) scale(0.2);
            animation: spitExpand 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, spitFade 2s ease-in 0.8s forwards;
        }

        .spit-text-effect {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink);
            white-space: nowrap;
            animation: textPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes textPop {
            0% { transform: translateX(-50%) scale(0.3) rotate(-10deg); opacity: 0; }
            100% { transform: translateX(-50%) scale(1.1) rotate(0deg); opacity: 1; }
        }

        /* Coin Floating Animation */
        .coin-pop {
            position: fixed;
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px var(--neon-yellow), 0 0 15px var(--neon-pink);
            pointer-events: none;
            z-index: 200;
            animation: coinFloat 0.8s ease-out forwards;
        }

        @keyframes coinFloat {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 1; }
            100% { transform: translate(-50%, -120%) scale(1.2); opacity: 0; }
        }

        /* Iron Man Laser Beam & Explosion */
        .shot-laser-line {
            position: absolute;
            stroke: #ff2a00;
            stroke-width: 4;
            filter: drop-shadow(0 0 10px #ff2a00) drop-shadow(0 0 20px var(--neon-yellow));
            stroke-dasharray: 250;
            stroke-dashoffset: 250;
            animation: shootWeb 0.25s ease-out forwards;
        }

        .laser-splat {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 98;
            animation: splatPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, webFade 1.5s ease-in 0.8s forwards;
        }

        /* Thor Thrown Hammer & Lightning Impact */
        .thrown-hammer {
            position: fixed;
            width: 42px;
            height: 42px;
            pointer-events: none;
            z-index: 105;
            filter: drop-shadow(0 0 12px var(--neon-cyan)) drop-shadow(0 0 20px #ffffff);
            transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.3, 1);
        }

        .lightning-splat {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 98;
            animation: splatPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, webFade 1.4s ease-in 0.6s forwards;
        }

        /* Hulk Thrown Screaming Person & Ground Smash */
        .thrown-person {
            position: fixed;
            width: 52px;
            height: 52px;
            pointer-events: none;
            z-index: 106;
            filter: drop-shadow(0 0 10px #39ff14);
            transition: transform 0.55s cubic-bezier(0.25, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scream-bubble {
            position: absolute;
            top: -32px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 127, 0.95);
            color: #ffe600;
            font-weight: 900;
            font-size: 0.85rem;
            padding: 3px 8px;
            border-radius: 10px;
            border: 1.5px solid #ffffff;
            white-space: nowrap;
            box-shadow: 0 0 12px var(--neon-pink);
            animation: screamShake 0.12s infinite alternate;
        }

        @keyframes screamShake {
            0% { transform: translateX(-52%) rotate(-6deg) scale(0.95); }
            100% { transform: translateX(-48%) rotate(6deg) scale(1.08); }
        }

        .hulk-smash-splat {
            position: absolute;
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 98;
            animation: splatPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, webFade 1.6s ease-in 0.8s forwards;
        }

        /* Dungeon System Styles */
        .dungeon-arena {
            position: relative;
            width: 100%;
            height: 360px;
            background: radial-gradient(circle at center, rgba(25, 10, 45, 0.95), rgba(8, 5, 18, 0.98));
            border: 2px solid var(--neon-purple);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(176, 0, 255, 0.4);
            display: none;
            cursor: crosshair;
        }

        .dungeon-hud {
            position: absolute;
            top: 12px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            font-weight: 900;
            font-size: 0.95rem;
        }

        .dungeon-hero-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 56px;
            height: 56px;
            transform: translate(-50%, -50%);
            z-index: 15;
            filter: drop-shadow(0 0 12px var(--neon-cyan));
            pointer-events: none;
        }

        .dungeon-enemy {
            position: absolute;
            width: 44px;
            height: 44px;
            transform: translate(-50%, -50%);
            z-index: 12;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .dungeon-enemy:active {
            transform: translate(-50%, -50%) scale(0.8);
        }

        .enemy-hp-bar {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 36px;
            height: 5px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #fff;
            border-radius: 4px;
            overflow: hidden;
        }

        .enemy-hp-fill {
            height: 100%;
            background: #ff007f;
            width: 100%;
            transition: width 0.15s;
        }

        /* Wallet HUD Bar */
        .wallet-hud {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(12, 10, 28, 0.85);
            border: 2px solid var(--neon-yellow);
            border-radius: 30px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 150;
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.4);
            backdrop-filter: blur(6px);
        }

        .wallet-amount {
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            font-size: 1.15rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
        }

        /* Ultimate Skill HUD Button */
        .ult-hud {
            position: fixed;
            top: 68px;
            right: 15px;
            background: linear-gradient(135deg, rgba(176, 0, 255, 0.9), rgba(255, 0, 127, 0.9));
            border: 2px solid var(--neon-cyan);
            border-radius: 25px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: pointer;
            z-index: 150;
            box-shadow: 0 0 18px rgba(0, 243, 255, 0.6);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ult-hud:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 0 28px var(--neon-yellow);
            border-color: var(--neon-yellow);
        }

        .ult-hud:disabled {
            background: rgba(30, 25, 50, 0.85);
            border-color: #64748b;
            color: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Ultimate Banner Flash */
        .ult-banner {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
            font-size: 2.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px var(--neon-pink), 0 0 30px var(--neon-cyan);
            background: rgba(8, 7, 17, 0.88);
            border: 3px solid var(--neon-yellow);
            padding: 14px 32px;
            border-radius: 20px;
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
            animation: ultBannerAnim 1.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes ultBannerAnim {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -80%) scale(0.95); opacity: 0; }
        }

        .screen-quake {
            animation: screenQuake 0.55s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenQuake {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-12px, 8px); }
            30% { transform: translate(12px, -10px); }
            45% { transform: translate(-10px, -8px); }
            60% { transform: translate(10px, 10px); }
            75% { transform: translate(-6px, 6px); }
        }

        /* Shop & Skin Locker Styles */
        .shop-skin-grid {

            outline: none;
            overflow: hidden;
        }

        /* Spider-web overlay on buttons */
        .quiz-btn::before {
            content: '';

        .quiz-btn:hover::before {
            opacity: 0.55;

            height: 100%;

            top: 100%;
            opacity: 1;
        }

        /* Spider Web Button Design */
        .fortune-btn {
            position: relative;
            background: linear-gradient(135deg, rgba(30, 0, 60, 0.9), rgba(176, 0, 255, 0.8));

            background-image: radial-gradient(circle, transparent 40%, rgba(255, 0, 127, 0.3) 41%, transparent 43%),
